<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتابل بازی‌های من</title>
    <!-- فونت فارسی وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- استایل هدر --- */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--card-bg); display: flex; justify-content: center; align-items: center; font-weight: bold; color: var(--accent); }
        .logout-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

        /* --- گرید بازی‌ها --- */
        .container {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .page-title { font-size: 1.8rem; margin-bottom: 1.5rem; font-weight: 700; }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            justify-content: center;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            width: 300px; /* عرض ثابت 300px */
            height: 300px; /* ارتفاع ثابت 300px */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 2px solid transparent;
        }
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border-color: var(--accent);
        }

        .game-icon {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            z-index: 1;
        }
        /* برای وقتی که عکس واقعی گذاشتید، این کلاس کمک می‌کند */
        .game-icon img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .game-info {
            position: relative;
            z-index: 2;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            padding: 1.5rem 1rem 1rem;
            text-align: center;
            pointer-events: none;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- مودال خوش‌آمدگویی (Overlay) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }
        
        .welcome-modal {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .welcome-modal h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .welcome-modal p {
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* استایل دکمه گوگل (شبیه‌سازی شده برای تست) */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-google:hover { background: #f1f5f9; }
        .btn-google img { width: 24px; height: 24px; }

        .btn-email {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-email:hover { background: var(--accent-hover); }

        .btn-guest {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-guest:hover { color: white; border-color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- هدر (در ابتدا مخفی است) -->
    <header id="mainHeader" class="hidden">
        <div class="logo">🎮 GamePortal</div>
        <div class="user-profile" id="userProfile" style="display: none;">
            <div class="user-avatar" id="userAvatar">U</div>
            <span id="userName">کاربر مهمان</span>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </header>

    <!-- محتوای اصلی (لیست بازی‌ها) -->
    <main class="container hidden" id="mainContent">
        <h1 class="page-title">بازی‌های من</h1>
        <div class="games-grid" id="gamesGrid">
            <!-- کارت‌های بازی با جاوااسکریپت ساخته می‌شوند -->
        </div>
    </main>

    <!-- مودال خوش‌آمدگویی و ورود -->
    <div class="modal-overlay" id="welcomeModal">
        <div class="welcome-modal">
            <h2>به پرتابل بازی خوش آمدی! 👋</h2>
            <p>
                اگر می‌خواهی تمام امتیازات، رکوردها و تاریخچه‌ی بازی‌هایت ذخیره شود و در هر دستگاهی به آن‌ها دسترسی داشته باشی، همین حالا ثبت‌نام کن. 
                <br>
                <strong>نگران نباش، ورود با گوگل فقط چند ثانیه طول می‌کشد.</strong>
            </p>
            
            <div class="auth-buttons">
                <!-- دکمه گوگل (برای تست شبیه‌سازی شده) -->
                <button class="btn-google" onclick="handleGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    ورود با گوگل
                </button>
                
                <button class="btn-email" onclick="alert('فرم ثبت‌نام با ایمیل (به زودی)')">
                    ثبت‌نام با ایمیل
                </button>
                
                <button class="btn-guest" onclick="continueAsGuest()">
                    ادامه بدون ثبت‌نام (مهمان)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- ۱. داده‌های بازی‌ها (فعلاً ۱۰ بازی) ---
        const games = [
            { id: 'game1', title: 'بازی ۱', icon: '🚗', link: 'car-game/index.html' },
            { id: 'game2', title: 'بازی ۲', icon: '🎮', link: '#' },
            { id: 'game3', title: 'بازی ۳', icon: '🏆', link: '#' },
            { id: 'game4', title: 'بازی ۴', icon: '👾', link: '#' },
            { id: 'game5', title: 'بازی ۵', icon: '🎲', link: '#' },
            { id: 'game6', title: 'بازی ۶', icon: '⚽', link: '#' },
            { id: 'game7', title: 'بازی ۷', icon: '🏎️', link: '#' },
            { id: 'game8', title: 'بازی ۸', icon: '🚀', link: '#' },
            { id: 'game9', title: 'بازی ۹', icon: '🧩', link: '#' },
            { id: 'game10', title: 'بازی ۱۰', icon: '🎯', link: '#' }
        ];

        // --- ۲. توابع ساخت رابط کاربری ---
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                // اگر بعداً عکس واقعی داشتید، درون game-icon یک تگ img قرار دهید
                card.innerHTML = `
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                    </div>
                `;
                
                // کلیک روی کارت بازی را در تب جدید باز می‌کند
                card.addEventListener('click', () => {
                    if (game.link && game.link !== '#') {
                        window.open(game.link, '_blank');
                    } else {
                        alert(`بازی «${game.title}» هنوز آماده نیست.`);
                    }
                });
                
                grid.appendChild(card);
            });
        }

        // --- ۳. منطق احراز هویت (شبیه‌سازی شده) ---
        
        // تابع کمکی برای ذخیره کاربر در localStorage
        function saveUser(user) {
            localStorage.setItem('gamePortalUser', JSON.stringify(user));
            updateUIForUser(user);
        }

        // به‌روزرسانی رابط کاربری بعد از ورود
        function updateUIForUser(user) {
            document.getElementById('welcomeModal').classList.add('hidden');
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            
            const profileDiv = document.getElementById('userProfile');
            const avatar = document.getElementById('userAvatar');
            const nameSpan = document.getElementById('userName');
            
            profileDiv.style.display = 'flex';
            
            if (user.type === 'google') {
                avatar.textContent = user.name.charAt(0).toUpperCase();
                avatar.style.background = '#38bdf8';
                avatar.style.color = '#0f172a';
                nameSpan.textContent = user.name;
            } else if (user.type === 'guest') {
                avatar.textContent = '👤';
                nameSpan.textContent = 'مهمان';
            }
        }

        // ورود با گوگل (شبیه‌سازی)
        function handleGoogleLogin() {
            // در دنیای واقعی، اینجا کد Google Identity Services اجرا می‌شود.
            // برای تست آفلاین، یک پروفایل گوگل شبیه‌سازی شده می‌سازیم.
            const mockUser = {
                type: 'google',
                name: 'کاربر گوگل',
                email: 'user@gmail.com',
                uid: 'google_' + Math.random().toString(36).substr(2, 9),
                photoURL: null
            };
            
            // شبیه‌سازی تاخیر شبکه
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'در حال اتصال...';
            btn.disabled = true;

            setTimeout(() => {
                saveUser(mockUser);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 800);
        }

        // ادامه به عنوان مهمان
        function continueAsGuest() {
            const guestUser = {
                type: 'guest',
                name: 'مهمان',
                uid: 'guest_' + Math.random().toString(36).substr(2, 9)
            };
            saveUser(guestUser);
        }

        // خروج
        function logout() {
            localStorage.removeItem('gamePortalUser');
            // بازگرداندن به حالت اولیه
            document.getElementById('welcomeModal').classList.remove('hidden');
            document.getElementById('mainHeader').classList.add('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('userProfile').style.display = 'none';
        }

        // --- ۴. مقداردهی اولیه ---
        document.addEventListener('DOMContentLoaded', () => {
            renderGames();
            
            // بررسی اینکه آیا کاربر قبلاً وارد شده است یا خیر
            const savedUser = localStorage.getItem('gamePortalUser');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    updateUIForUser(user);
                } catch (e) {
                    localStorage.removeItem('gamePortalUser');
                }
            }
        });
    </script>
</body>
</html>
